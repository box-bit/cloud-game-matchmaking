AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Multiplayer Matchmaking Engine

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    Environment:
      Variables:
        PLAYER_TABLE: !Ref PlayerProfilesTable
        TICKETS_TABLE: !Ref MatchmakingTicketsTable

Resources:

  # ── DYNAMODB TABLES ──────────────────────────────────────────
  PlayerProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlayerProfiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: UserId
          AttributeType: S
      KeySchema:
        - AttributeName: UserId
          KeyType: HASH

  MatchmakingTicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MatchmakingTickets
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: TicketId
          AttributeType: S
      KeySchema:
        - AttributeName: TicketId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true

  # ── COGNITO ───────────────────────────────────────────────────
  PlayerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: MatchmakingUserPool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false

  PlayerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: MatchmakingAppClient
      UserPoolId: !Ref PlayerUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  # ── API GATEWAY ───────────────────────────────────────────────
  MatchmakingApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: MatchmakingAPI
      StageName: dev
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt PlayerUserPool.Arn
        # CORS preflight requests carry no auth header — let them through.
        AddDefaultAuthorizerToCorsPreflight: false


  # ── GAME SERVER (ECS) ─────────────────────────────────────────

  # ECR repository — push the game-server Docker image here before deploying
  GameServerRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: redeclipse-server
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"Expire untagged images","selection":{"tagStatus":"untagged","countType":"imageCountMoreThan","countNumber":3},"action":{"type":"expire"}}]}

  GameServerCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-game-servers"
      ClusterSettings:
        - Name: containerInsights
          Value: disabled

  # UDP 32768-65535: Docker's dynamic port range for bridge-mode HostPort 0 mappings
  GameServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Red Eclipse game server
      SecurityGroupIngress:
        - IpProtocol: udp
          FromPort: 32768
          ToPort: 65535
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  # ECS-optimised Amazon Linux 2023 AMI — agent pre-installed, registers to cluster via ecs.config
  # LabInstanceProfile is the AWS Academy EC2 instance profile backed by LabRole
  GameServerLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        InstanceType: t3.micro
        ImageId: "{{resolve:ssm:/aws/service/ecs/optimized-ami/amazon-linux-2023/recommended/image_id}}"
        IamInstanceProfile:
          Name: LabInstanceProfile
        SecurityGroupIds:
          - !GetAtt GameServerSecurityGroup.GroupId
        UserData:
          Fn::Base64: !Sub |
            #!/bin/bash
            echo ECS_CLUSTER=${GameServerCluster} >> /etc/ecs/ecs.config

  GameServerASG:
    Type: AWS::AutoScaling::AutoScalingGroup
    Properties:
      MinSize: "1"
      MaxSize: "2"
      DesiredCapacity: "1"
      LaunchTemplate:
        LaunchTemplateId: !Ref GameServerLaunchTemplate
        Version: !GetAtt GameServerLaunchTemplate.LatestVersionNumber
      AvailabilityZones: !GetAZs ""

  GameServerCapacityProvider:
    Type: AWS::ECS::CapacityProvider
    Properties:
      AutoScalingGroupProvider:
        AutoScalingGroupArn: !Ref GameServerASG
        ManagedScaling:
          Status: ENABLED
          TargetCapacity: 80
        ManagedTerminationProtection: DISABLED

  # Associates the capacity provider with the cluster so ECS can drive ASG scaling
  GameServerClusterCPAssociation:
    Type: AWS::ECS::ClusterCapacityProviderAssociations
    Properties:
      Cluster: !Ref GameServerCluster
      CapacityProviders:
        - !Ref GameServerCapacityProvider
      DefaultCapacityProviderStrategy:
        - CapacityProvider: !Ref GameServerCapacityProvider
          Weight: 1

  GameServerLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/redeclipse-server
      RetentionInDays: 7

  # bridge + HostPort 0: ECS assigns a random host UDP port per container.
  # After RunTask, Lambda calls DescribeTasks to read networkBindings[0].hostPort.
  GameServerTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: redeclipse-server
      NetworkMode: bridge
      RequiresCompatibilities:
        - EC2
      ExecutionRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      TaskRoleArn: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      ContainerDefinitions:
        - Name: redeclipse-server
          Image: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/redeclipse-server:latest"
          Memory: 128
          PortMappings:
            - ContainerPort: 26000
              Protocol: udp
              HostPort: 0
          Environment:
            - Name: MAX_PLAYERS
              Value: "8"
            - Name: SERVER_PUBLIC
              Value: "0"
            - Name: SERVER_DESC
              Value: !Sub "${AWS::StackName} server"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref GameServerLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: game-server

  # Warm pool: 2 servers always ready. binpack fills one instance before triggering ASG scale-out.
  GameServerWarmPool:
    Type: AWS::ECS::Service
    DependsOn: GameServerClusterCPAssociation
    Properties:
      ServiceName: game-server-warm-pool
      Cluster: !Ref GameServerCluster
      TaskDefinition: !Ref GameServerTaskDefinition
      DesiredCount: 2
      CapacityProviderStrategy:
        - CapacityProvider: !Ref GameServerCapacityProvider
          Weight: 1
      PlacementStrategies:
        - Type: binpack
          Field: memory

  # ── LAMBDA FUNCTIONS ──────────────────────────────────────────
  StartMatchmakingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: StartMatchmaking
      CodeUri: src/startMatchmaking/
      Handler: index.handler
      Tags: {}
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        MatchApi:
          Type: Api
          Properties:
            RestApiId: !Ref MatchmakingApi
            Path: /match
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  MatchStatusPollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: MatchStatusPoller
      CodeUri: src/matchStatusPoller/
      Handler: index.handler
      Timeout: 55
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          ECS_CLUSTER: !Ref GameServerCluster
          ECS_TASK_DEFINITION: !Ref GameServerTaskDefinition
          MATCH_SIZE: "8"
      Events:
        MatchmakerSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

  GetMatchStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetMatchStatus
      CodeUri: src/getMatchStatus/
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        GetMatchApi:
          Type: Api
          Properties:
            RestApiId: !Ref MatchmakingApi
            Path: /match/{ticketId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  RegisterUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RegisterUser
      CodeUri: src/registerUser/
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          USER_POOL_ID: !Ref PlayerUserPool
          USER_POOL_CLIENT_ID: !Ref PlayerUserPoolClient
      Events:
        RegisterApi:
          Type: Api
          Properties:
            RestApiId: !Ref MatchmakingApi
            Path: /register
            Method: POST
            Auth:
              Authorizer: NONE

  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetProfile
      CodeUri: src/getProfile/
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        GetProfileApi:
          Type: Api
          Properties:
            RestApiId: !Ref MatchmakingApi
            Path: /profile
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  CancelMatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CancelMatch
      CodeUri: src/cancelMatch/
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        CancelMatchApi:
          Type: Api
          Properties:
            RestApiId: !Ref MatchmakingApi
            Path: /match/{ticketId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

Outputs:
  UserPoolId:
    Value: !Ref PlayerUserPool
    Description: Cognito User Pool ID

  UserPoolClientId:
    Value: !Ref PlayerUserPoolClient
    Description: Cognito App Client ID

  PlayerTableName:
    Value: !Ref PlayerProfilesTable
    Description: DynamoDB Player Profiles Table

  ApiEndpoint:
    Value: !Sub "https://${MatchmakingApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
    Description: API Gateway base URL


  GameServerClusterName:
    Value: !Ref GameServerCluster
    Description: ECS cluster hosting Red Eclipse containers

  GameServerRepositoryUri:
    Value: !Sub "${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/redeclipse-server"
    Description: ECR image URI — tag and push game-server image here before deploying

  GameServerTaskDefinitionArn:
    Value: !Ref GameServerTaskDefinition
    Description: ECS task definition ARN for Red Eclipse server containers
