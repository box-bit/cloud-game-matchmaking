AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Multiplayer Matchmaking Engine

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    Environment:
      Variables:
        PLAYER_TABLE: !Ref PlayerProfilesTable
        TICKETS_TABLE: !Ref MatchmakingTicketsTable

Resources:

  # ── DYNAMODB TABLES ──────────────────────────────────────────
  PlayerProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlayerProfiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: UserId
          AttributeType: S
      KeySchema:
        - AttributeName: UserId
          KeyType: HASH

  MatchmakingTicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MatchmakingTickets
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: TicketId
          AttributeType: S
      KeySchema:
        - AttributeName: TicketId
          KeyType: HASH

  # ── COGNITO ───────────────────────────────────────────────────
  PlayerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: MatchmakingUserPool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false

  PlayerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: MatchmakingAppClient
      UserPoolId: !Ref PlayerUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  # ── API GATEWAY ───────────────────────────────────────────────
  MatchmakingApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: MatchmakingAPI
      StageName: dev
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt PlayerUserPool.Arn

  # ── LAMBDA FUNCTIONS ──────────────────────────────────────────
  StartMatchmakingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: StartMatchmaking
      CodeUri: src/startMatchmaking/
      Handler: index.handler
      Tags: {}
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        MatchApi:
          Type: Api
          Properties:
            RestApiId: !Ref MatchmakingApi
            Path: /match
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

Outputs:
  UserPoolId:
    Value: !Ref PlayerUserPool
    Description: Cognito User Pool ID

  UserPoolClientId:
    Value: !Ref PlayerUserPoolClient
    Description: Cognito App Client ID

  PlayerTableName:
    Value: !Ref PlayerProfilesTable
    Description: DynamoDB Player Profiles Table

  ApiEndpoint:
    Value: !Sub "https://${MatchmakingApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
    Description: API Gateway base URL
