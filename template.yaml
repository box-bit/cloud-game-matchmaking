AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Multiplayer Matchmaking Engine

Globals:
  Function:
    Runtime: python3.12
    Timeout: 30
    Environment:
      Variables:
        PLAYER_TABLE: !Ref PlayerProfilesTable
        TICKETS_TABLE: !Ref MatchmakingTicketsTable

Resources:

  # ── DYNAMODB TABLES ──────────────────────────────────────────
  PlayerProfilesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: PlayerProfiles
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: UserId
          AttributeType: S
      KeySchema:
        - AttributeName: UserId
          KeyType: HASH

  MatchmakingTicketsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: MatchmakingTickets
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: TicketId
          AttributeType: S
      KeySchema:
        - AttributeName: TicketId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: TTL
        Enabled: true

  # ── COGNITO ───────────────────────────────────────────────────
  PlayerUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: MatchmakingUserPool
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireNumbers: false
          RequireSymbols: false

  PlayerUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: MatchmakingAppClient
      UserPoolId: !Ref PlayerUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false

  # ── API GATEWAY ───────────────────────────────────────────────
  MatchmakingApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: MatchmakingAPI
      StageName: dev
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Authorization,Content-Type'"
        AllowMethods: "'GET,POST,DELETE,OPTIONS'"
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !GetAtt PlayerUserPool.Arn
        # CORS preflight requests carry no auth header — let them through.
        AddDefaultAuthorizerToCorsPreflight: false


  # ── GAME SERVER (EC2) ─────────────────────────────────────────
  GameServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Red Eclipse game server
      SecurityGroupIngress:
        - IpProtocol: udp
          FromPort: 26000
          ToPort: 26001
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0

  GameServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      # Latest Ubuntu 22.04 LTS AMI via Canonical's SSM parameter — always current, no hardcoded ID
      ImageId: "{{resolve:ssm:/aws/service/canonical/ubuntu/server/22.04/stable/current/amd64/hvm/ebs-gp2/ami-id}}"
      SecurityGroupIds:
        - !GetAtt GameServerSecurityGroup.GroupId
      UserData:
        Fn::Base64: |
          #!/bin/bash
          apt-get update -y
          apt-get install -y software-properties-common
          add-apt-repository -y universe
          apt-get update -y
          apt-get install -y redeclipse
          cat > /etc/systemd/system/redeclipse-server.service << 'UNIT'
          [Unit]
          Description=Red Eclipse Dedicated Server
          After=network.target

          [Service]
          Type=simple
          Environment=HOME=/root
          ExecStart=/usr/games/redeclipse -d
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
          UNIT
          systemctl daemon-reload
          systemctl enable redeclipse-server
          systemctl start redeclipse-server

  # ── LAMBDA FUNCTIONS ──────────────────────────────────────────
  StartMatchmakingFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: StartMatchmaking
      CodeUri: src/startMatchmaking/
      Handler: index.handler
      Tags: {}
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        MatchApi:
          Type: Api
          Properties:
            RestApiId: !Ref MatchmakingApi
            Path: /match
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer

  MatchStatusPollerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: MatchStatusPoller
      CodeUri: src/matchStatusPoller/
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          GAME_SERVER_IP: !GetAtt GameServerInstance.PublicIp
          GAME_SERVER_PORT: "26000"
      Events:
        MatchmakerSchedule:
          Type: Schedule
          Properties:
            Schedule: rate(1 minute)
            Enabled: true

  GetMatchStatusFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetMatchStatus
      CodeUri: src/getMatchStatus/
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        GetMatchApi:
          Type: Api
          Properties:
            RestApiId: !Ref MatchmakingApi
            Path: /match/{ticketId}
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  RegisterUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: RegisterUser
      CodeUri: src/registerUser/
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Environment:
        Variables:
          USER_POOL_ID: !Ref PlayerUserPool
          USER_POOL_CLIENT_ID: !Ref PlayerUserPoolClient
      Events:
        RegisterApi:
          Type: Api
          Properties:
            RestApiId: !Ref MatchmakingApi
            Path: /register
            Method: POST
            Auth:
              Authorizer: NONE

  GetProfileFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: GetProfile
      CodeUri: src/getProfile/
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        GetProfileApi:
          Type: Api
          Properties:
            RestApiId: !Ref MatchmakingApi
            Path: /profile
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer

  CancelMatchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: CancelMatch
      CodeUri: src/cancelMatch/
      Handler: index.handler
      Role: !Sub "arn:aws:iam::${AWS::AccountId}:role/LabRole"
      Events:
        CancelMatchApi:
          Type: Api
          Properties:
            RestApiId: !Ref MatchmakingApi
            Path: /match/{ticketId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

Outputs:
  UserPoolId:
    Value: !Ref PlayerUserPool
    Description: Cognito User Pool ID

  UserPoolClientId:
    Value: !Ref PlayerUserPoolClient
    Description: Cognito App Client ID

  PlayerTableName:
    Value: !Ref PlayerProfilesTable
    Description: DynamoDB Player Profiles Table

  ApiEndpoint:
    Value: !Sub "https://${MatchmakingApi}.execute-api.${AWS::Region}.amazonaws.com/dev"
    Description: API Gateway base URL


  GameServerPublicIp:
    Value: !GetAtt GameServerInstance.PublicIp
    Description: Public IP of the Red Eclipse EC2 game server
